<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision · Escáner</title>
<style>
  :root {
    --bg: #0f1115; --panel: rgba(24, 27, 34, .94); --line: #262a33; --text: #e6e8ee; --muted: #8b93a3;
    --accent: #2f6feb; --danger: #da3633;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; max-height: 70vh; overflow-y: auto;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 14px 16px max(16px, env(safe-area-inset-bottom));
  }
  .sheet h1 { font-size: 18px; margin: 0 0 4px; }
  .sheet p { margin: 0 0 10px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px;
    padding: 10px 14px; min-height: 44px; cursor: pointer;
  }
  select { background: #30363d; font-weight: 500; }
  button.secondary { background: #30363d; }
  button.danger { background: var(--danger); }
  button.small { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  button:disabled { background: #30363d; color: var(--muted); }
  .stats { font: 12px/1.4 ui-monospace, "Cascadia Mono", Menlo, monospace; color: var(--muted); white-space: pre-wrap; margin-top: 8px; }

  #saved { margin-top: 14px; }
  #saved h2 { font-size: 14px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .scan-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .scan-item .info { flex: 1; min-width: 0; }
  .scan-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scan-item .meta { color: var(--muted); font-size: 12px; }

  /* HUD dentro de la sesión AR (dom-overlay) */
  #overlay { position: fixed; inset: 0; pointer-events: none;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; justify-content: space-between; }
  #overlay .hud { align-self: flex-start; background: rgba(0,0,0,.55); border-radius: 10px; padding: 8px 10px;
    font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre; color: #fff; }
  #overlay .row { pointer-events: auto; justify-content: center; }
  #hint { align-self: center; background: rgba(0,0,0,.55); border-radius: 999px; padding: 6px 14px; color: #fff; text-align: center; }

  /* Joystick del modo paseo */
  #joy { position: fixed; z-index: 1; width: 120px; height: 120px; margin: -60px 0 0 -60px;
    border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); pointer-events: none; }
  #joy-knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,.45); transform: translate(-50%, -50%); }
  #walk-hint { position: fixed; z-index: 1; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); border-radius: 999px; padding: 6px 14px; font-size: 12px; color: #fff; pointer-events: none; white-space: nowrap; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="joy" hidden><div id="joy-knob"></div></div>
<div id="walk-hint" hidden>Izquierda: moverse · Derecha: mirar</div>

<section class="sheet" id="sheet">
  <!-- Inicio -->
  <div id="home">
    <h1>Vision · Escáner</h1>
    <p id="home-text">Comprobando soporte de AR…</p>
    <div class="row">
      <button id="btn-scan" disabled>Escanear</button>
      <select id="quality" aria-label="Calidad">
        <option value="0.03">Alta · 3 cm</option>
        <option value="0.04">Normal · 4 cm</option>
      </select>
    </div>
    <div id="saved" hidden>
      <h2>Escaneos guardados</h2>
      <div id="saved-list"></div>
    </div>
  </div>

  <!-- Visor -->
  <div id="viewer" hidden>
    <h1 id="viewer-title">Escaneo</h1>
    <p id="viewer-text"></p>
    <div class="row">
      <button id="btn-walk" class="secondary">Caminar</button>
      <button id="btn-shade" class="secondary">Sombreado</button>
      <button id="btn-export" class="secondary">Exportar .glb</button>
      <button id="btn-home" class="secondary">Mis escaneos</button>
      <button id="btn-new">Nuevo escaneo</button>
    </div>
    <div class="stats" id="viewer-stats"></div>
  </div>
</section>

<!-- Overlay durante la sesión AR -->
<div id="overlay" hidden>
  <div class="hud" id="hud">Iniciando…</div>
  <div id="hint">Mueve el teléfono despacio</div>
  <div class="row">
    <button id="btn-pause" class="secondary">Pausar</button>
    <button id="btn-stop" class="danger">Terminar</button>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
